services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: poetry run python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - ./src:/app/src
      - ./manage.py:/app/manage.py
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build: .
    command: poetry run celery -A paper_ai.config worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - app_data:/app/data
      - ./src:/app/src
      - ./manage.py:/app/manage.py
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  redis_data:
  app_data:
